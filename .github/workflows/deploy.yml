name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Add current Excel data to the deployment
        env:
          YANDEX_PUBLIC_KEY: https://disk.yandex.ru/d/AH9oiy7YcSWXtA
        run: |
          API_URL="https://cloud-api.yandex.net/v1/disk/public/resources/download?public_key=$(python -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["YANDEX_PUBLIC_KEY"], safe=""))')&path=%2Fyasnoland-tracker.xlsx"
          DOWNLOAD_URL=$(curl --fail --silent --show-error "$API_URL" | jq -r '.href')
          test -n "$DOWNLOAD_URL" && test "$DOWNLOAD_URL" != "null"
          curl --fail --location --silent --show-error "$DOWNLOAD_URL" --output dist/yasnoland-tracker.xlsx
          test $(wc -c < dist/yasnoland-tracker.xlsx) -gt 1000
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
